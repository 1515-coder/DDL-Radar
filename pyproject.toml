[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mooc-deadlines"
version = "0.1.0"
description = "提取中国大学 MOOC 在学课程的作业和测试截止时间"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.51,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
mooc-ddl = "mooc_deadlines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

