<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px 20px;font:15px/1.6 system-ui,sans-serif;color:#18202b;background:#f4f6f8}
    h1{font-size:25px;letter-spacing:-.4px;margin:4px 0 8px}p{color:#687385;margin:0 0 20px}.card{padding:16px;margin:10px 0;border:1px solid #e2e7ed;border-radius:12px;background:#fff}.card strong{display:block;margin-bottom:5px}.tag{display:inline-block;padding:3px 8px;border-radius:6px;background:#eaf0ff;color:#315efb;font-weight:700;font-size:12px}
  </style>
</head>
<body>
  <span class="tag">Android</span>
  <h1>DDL Radar</h1>
  <p>认证平台后，点击上方“同步课程与待办”即可集中查看。</p>
  <section class="card"><strong>1. 选择平台</strong>点击顶部的 MOOC、延河课堂或智园课堂。</section>
  <section class="card"><strong>2. 完成登录</strong>在当前页面走完学校或平台认证，并进入课程页面。</section>
  <section class="card"><strong>3. 同步</strong>读取课程列表以及作业、测验和问卷待办。</section>
  <section class="card"><strong>本地保护</strong>认证快照使用 Android Keystore 的不可导出密钥进行 AES-GCM 加密。本原型不会上传认证数据。</section>
</body>
</html>
